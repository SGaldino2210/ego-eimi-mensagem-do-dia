<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ego Eimi — Mensagem do Dia</title>
<meta name="description" content="Devocional diário com as falas diretas de Jesus, extraídas do livro Ego Eimi — A Voz de Jesus Sem Interrupções." />
<meta name="theme-color" content="#f7efe1" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ego Eimi" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
<div class="app">

  <header class="app-header">
    <p class="app-kicker">Ego Eimi</p>
    <h1 class="app-title">Mensagem do Dia</h1>
  </header>

  <main class="card" id="card" aria-live="polite">
    <p class="card-date" id="data-exibida">—</p>

    <p class="card-quote-mark" aria-hidden="true">“</p>

    <blockquote class="card-quote" id="mensagem-texto"></blockquote>

    <button class="btn-continuar" id="btn-continuar" hidden>continuar lendo →</button>

    <div class="card-meta">
      <p class="card-ref" id="mensagem-ref"></p>
      <p class="card-contexto" id="mensagem-contexto"></p>
    </div>
  </main>

  <nav class="date-nav" aria-label="Navegar entre dias">
    <button class="nav-btn" id="btn-anterior" aria-label="Dia anterior" type="button">‹</button>
    <input class="date-input" id="input-data" type="date" aria-label="Escolher data" />
    <button class="nav-btn" id="btn-proximo" aria-label="Dia seguinte" type="button">›</button>
  </nav>

  <div class="actions">
    <button class="btn-secondary" id="btn-hoje" type="button">Hoje</button>
    <button class="btn-primary" id="btn-compartilhar" type="button">Compartilhar</button>
  </div>

  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

  <footer class="app-footer">
    <p>
      Do livro <em>Ego Eimi — A Voz de Jesus Sem Interrupções</em>,
      de Sergio Galdino Bernardes.
    </p>
  </footer>

</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
